name: FPM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            version: latest
          - os: windows-latest
            compiler: gcc
            version: latest
          - os: macos-latest
            compiler: gcc
            version: latest
          - os: ubuntu-latest
            compiler: intel
            version: "2025.0"
          - os: windows-latest
            compiler: intel
            version: "2025.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Set up fpm
        uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: fpm test