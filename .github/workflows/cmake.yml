name: CMake

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.compiler }} (${{ matrix.library }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        library: [static, shared]
        include:
          - os: ubuntu-latest
            compiler: gcc
            version: latest
          - os: windows-latest
            compiler: gcc
            version: latest
          - os: macos-latest
            compiler: gcc
            version: latest
          - os: ubuntu-latest
            compiler: intel
            version: "2025.0"
          - os: windows-latest
            compiler: intel
            version: "2025.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up Fortran
        id: fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_Fortran_COMPILER="${{ steps.fortran.outputs.fc }}"
          -DAUTODIFF_ENABLE_OPENMP=ON
          -DBUILD_TESTING=ON
          -DBUILD_SHARED_LIBS=${{ matrix.library == 'shared' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/build/install"

      - name: Configure installed-package consumer
        run: >-
          cmake -S cmake/install_smoke -B build/install-smoke -G Ninja
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"

      - name: Build installed-package consumer
        run: cmake --build build/install-smoke --parallel

      - name: Test installed-package consumer
        run: ctest --test-dir build/install-smoke --output-on-failure